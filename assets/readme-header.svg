<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">MediaStorm CapCut Skill — CapCut × Remotion</title>
  <desc id="desc">A dark banner with the project title, a stylized editing timeline, keyframes, audio waveform, and color chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a14"/>
      <stop offset="0.5" stop-color="#10142a"/>
      <stop offset="1" stop-color="#1b0f2e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#c46bff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d7ff"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5f7e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6d4dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#20c8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#20c8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="audioClip">
      <rect x="46" y="90" width="438" height="26" rx="5"/>
    </clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="170" cy="80" r="220" fill="url(#glowA)"/>
  <circle cx="1120" cy="270" r="240" fill="url(#glowB)"/>

  <!-- left copy -->
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="64" y="52" width="286" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="80" cy="66" r="4" fill="#7c5cff"/>
    <text x="92" y="71" fill="#cfd2ff" font-size="12" letter-spacing="2.2" font-weight="600">MEDIASTORM · PERSONAL STUDY</text>

    <text x="62" y="140" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="1.5">MediaStorm</text>
    <text x="64" y="190" fill="url(#violet)" font-size="34" font-weight="800" letter-spacing="1">CapCut × Remotion</text>
    <text x="65" y="226" fill="#e7e9f7" font-size="18" font-weight="500">剪辑判断 · 声音 · 动效 · 调色 · 交付</text>
    <text x="65" y="254" fill="#8f95b8" font-size="14">18 课细粒度画面解析 · 1 个入口 + 10 个子 Skill</text>

    <g font-size="12" font-weight="600" letter-spacing="1.2">
      <rect x="64" y="274" width="112" height="26" rx="13" fill="#7c5cff" fill-opacity="0.18" stroke="#8d75ff" stroke-opacity="0.55"/>
      <text x="80" y="291" fill="#c9bcff">CAPCUT CLI</text>
      <rect x="186" y="274" width="122" height="26" rx="13" fill="#2ad2ff" fill-opacity="0.13" stroke="#2ad2ff" stroke-opacity="0.45"/>
      <text x="202" y="291" fill="#a9ecff">REMOTION / TS</text>
      <rect x="318" y="274" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="334" y="291" fill="#b9bdd6">18 LESSONS</text>
    </g>
  </g>

  <!-- right timeline card -->
  <g transform="translate(690 56)">
    <rect x="0" y="0" width="526" height="208" rx="18" fill="#0b0e1c" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="526" height="38" rx="18" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="20" cy="19" r="4" fill="#ff6b8a"/>
    <circle cx="34" cy="19" r="4" fill="#ffc857"/>
    <circle cx="48" cy="19" r="4" fill="#4ee1a0"/>
    <text x="66" y="23" fill="#8f95b8" font-size="11" letter-spacing="1.4" font-family="'SF Mono',Menlo,monospace">TIMELINE 01 · 30 FPS</text>
    <text x="452" y="23" fill="#6f7597" font-size="10" font-family="'SF Mono',Menlo,monospace">00:10:24</text>

    <!-- video track -->
    <text x="18" y="66" fill="#6f7597" font-size="10" font-family="'SF Mono',Menlo,monospace">V1</text>
    <rect x="46" y="48" width="96" height="26" rx="5" fill="url(#violet)" fill-opacity="0.85"/>
    <rect x="146" y="48" width="130" height="26" rx="5" fill="url(#cyan)" fill-opacity="0.8"/>
    <rect x="280" y="48" width="92" height="26" rx="5" fill="url(#warm)" fill-opacity="0.85"/>
    <rect x="376" y="48" width="118" height="26" rx="5" fill="#5a63d8" fill-opacity="0.8"/>
    <text x="56" y="65" fill="#ffffff" fill-opacity="0.85" font-size="9" font-family="'SF Mono',Menlo,monospace">A-ROLL</text>
    <text x="156" y="65" fill="#ffffff" fill-opacity="0.85" font-size="9" font-family="'SF Mono',Menlo,monospace">B-ROLL</text>
    <text x="290" y="65" fill="#1b1020" fill-opacity="0.8" font-size="9" font-family="'SF Mono',Menlo,monospace">TITLE</text>

    <!-- audio track -->
    <text x="18" y="108" fill="#6f7597" font-size="10" font-family="'SF Mono',Menlo,monospace">A1</text>
    <rect x="46" y="90" width="438" height="26" rx="5" fill="#12304a" stroke="#2ad2ff" stroke-opacity="0.28"/>
    <g clip-path="url(#audioClip)">
      <path id="wavePath" d="M52 103h4v-6h4v12h4v-9h4v7h4v-13h4v16h4v-7h4v3h4v-9h4v13h4v-5h4v8h4v-15h4v18h4v-9h4v4h4v-6h4v10h4v-13h4v7h4v-2h4v9h4v-12h4v15h4v-6h4v3h4v-9h4v11h4v-5h4v7h4v-14h4v17h4v-8h4v4h4v-6h4v9h4v-11h4v5h4v-2h4v8h4v-13h4v15h4v-7h4v3h4v-9h4v12h4v-5h4v6h4v-11h4v14h4v-8h4v4h4v-6h4v9h4v-12h4v6h4v-3h4v8h4v-10h4v13h4v-6h4v2h4v-7h4v9h4v-4h4v5h4v-11h4v13h4v-7h4v3h4v-8h4v10h4v-5h4v6h4v-12h4v14h4v-7h4v4h4v-9h4v11h4v-5h4v2h4v-8h4v10h4v-4h4v6h4v-12h4v14h4v-7h4v3h4v-9h4v11h4v-5h4v4h4v-8h4v10h4v-6h4v2h4v-7h4v9h4v-4h4v5h4v-11h4v13h4v-7h4v3h4v-8h4v10h4v-5h4v6h4v-12h4v14h4v-7h4v4h4v-9h4v11h4v-5h4v2h4v-8h4v10h4v-4h4v6h4v-12h4v14h4v-7h4v3h4v-9h4v11h4v-5h4v4h4v-8h4v10h4v-6h4v2h4v-7h4v9h4v-4h4v5h4v-11h4v13h4v-7h4v3h4v-8h4v10h4v-5h4v6h4v-12h4v14h4v-7h4v4h4v-9h4v11h4v-5h4v2h4v-8h4v10h4v-4h4v6h4v-12h4v14h4v-7h4v3h4v-9h4v11h4v-5h4v4h4v-8h4v10h4v-6h4v2h4v-7h4v9h4v-4h4v5h4v-11h4v13h4v-7h4v3h4v-8h4v10h4v-5h4v6h4v-12h4v14h4v-7h4v4h4v-9h4v11h4v-5h4v2h4v-8h4v10h4v-4h4v6h4v-12h4v14h4v-7h4v3h4v-9h4v11h4v-5" fill="none" stroke="#2ad2ff" stroke-opacity="0.55" stroke-width="1.2"/>
      <use href="#wavePath" transform="translate(180 0)" opacity="0.45"/>
    </g>
    <text x="56" y="107" fill="#a9ecff" font-size="9" font-family="'SF Mono',Menlo,monospace">MUSIC BED</text>

    <!-- captions track -->
    <text x="18" y="150" fill="#6f7597" font-size="10" font-family="'SF Mono',Menlo,monospace">T1</text>
    <rect x="46" y="132" width="72" height="26" rx="5" fill="#3a2a5e" stroke="#c46bff" stroke-opacity="0.35"/>
    <rect x="124" y="132" width="96" height="26" rx="5" fill="#3a2a5e" stroke="#c46bff" stroke-opacity="0.35"/>
    <rect x="226" y="132" width="64" height="26" rx="5" fill="#3a2a5e" stroke="#c46bff" stroke-opacity="0.35"/>
    <rect x="296" y="132" width="108" height="26" rx="5" fill="#3a2a5e" stroke="#c46bff" stroke-opacity="0.35"/>
    <rect x="410" y="132" width="74" height="26" rx="5" fill="#3a2a5e" stroke="#c46bff" stroke-opacity="0.35"/>
    <text x="56" y="149" fill="#e0c9ff" font-size="9" font-family="'SF Mono',Menlo,monospace">BURN-IN</text>

    <!-- playhead + keyframes -->
    <line x1="336" y1="44" x2="336" y2="180" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4"/>
    <path d="M332 44h8v8l-4 5-4-5z" fill="#ffffff"/>
    <g fill="#ffffff">
      <path d="M330 78l6-6 6 6-6 6z"/>
      <path d="M330 118l6-6 6 6-6 6z"/>
      <path d="M330 160l6-6 6 6-6 6z"/>
    </g>

    <!-- color chips -->
    <g transform="translate(404 174)">
      <text x="0" y="13" fill="#6f7597" font-size="9" font-family="'SF Mono',Menlo,monospace">CDL</text>
      <rect x="30" y="0" width="18" height="18" rx="4" fill="#ffb347"/>
      <rect x="52" y="0" width="18" height="18" rx="4" fill="#ff6b8a"/>
      <rect x="74" y="0" width="18" height="18" rx="4" fill="#7c5cff"/>
      <rect x="96" y="0" width="18" height="18" rx="4" fill="#2ad2ff"/>
      <rect x="118" y="0" width="18" height="18" rx="4" fill="#4ee1a0"/>
    </g>
  </g>
</svg>
